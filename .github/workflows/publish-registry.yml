# Generated by scripts/prepare-mcp-repository.mjs in ohmyho.st; the next release replaces any edit.
name: Publish to the MCP Registry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [server.json]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install mcp-publisher 1.8.7
        run: |
          curl --fail --silent --show-error --location --output mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz
          echo "00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579  mcp-publisher.tar.gz" | sha256sum --check --strict -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
